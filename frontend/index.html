<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swastham-lite — Sleep Hygiene Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0F1329;
            --bg-deep: #0A0D1E;
            --panel: #171C3B;
            --panel-raised: #1E2449;
            --border: #2A3163;
            --text: #F1EEE7;
            --text-dim: #9CA3C4;
            --accent: #9B8CFF;
            --accent-dim: #6E63B8;
            --glow: #E8B975;
            --danger: #E88A8A;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Work Sans', -apple-system, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }


        header {
            position: relative;
            padding: 2.25rem 1.5rem 1.5rem;
            text-align: center;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
            background: var(--bg-deep);
        }

        header::before {
            content: "";
            position: absolute;
            top: -60%;
            left: 50%;
            transform: translateX(-50%);
            width: 480px;
            height: 480px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(155, 140, 255, 0.16) 0%, rgba(155, 140, 255, 0) 70%);
            animation: breathe 6s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes breathe {

            0%,
            100% {
                opacity: 0.6;
                transform: translateX(-50%) scale(0.92);
            }

            50% {
                opacity: 1;
                transform: translateX(-50%) scale(1.05);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            header::before {
                animation: none;
            }
        }

        header h1 {
            position: relative;
            font-family: 'Fraunces', serif;
            font-weight: 500;
            font-size: 1.9rem;
            letter-spacing: -0.01em;
            margin: 0 0 0.35rem;
        }

        header p {
            position: relative;
            margin: 0;
            color: var(--text-dim);
            font-size: 0.92rem;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            padding: 1.25rem 1rem 0;
            min-height: 0;
        }

        #status-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-dim);
            padding: 0 0.25rem 0.75rem;
        }

        #status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-dim);
            flex-shrink: 0;
        }

        #status-dot.connected {
            background: #7FD9A6;
        }

        #status-dot.error {
            background: var(--danger);
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 0.25rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            min-height: 0;
        }

        .msg {
            max-width: 82%;
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        .msg.user {
            align-self: flex-end;
            background: var(--accent);
            color: #14162E;
            border-bottom-right-radius: 4px;
        }

        .msg.assistant {
            align-self: flex-start;
            background: var(--panel);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .msg.assistant.mode-crisis {
            border-color: var(--danger);
            background: rgba(232, 138, 138, 0.08);
        }

        .badge {
            display: inline-block;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-dim);
            margin-bottom: 0.4rem;
            padding: 0.15rem 0.5rem;
            border: 1px solid var(--border);
            border-radius: 999px;
        }

        .badge.tool {
            color: var(--glow);
            border-color: var(--glow);
        }

        .badge.crisis {
            color: var(--danger);
            border-color: var(--danger);
        }

        .badge.rag {
            color: var(--accent);
            border-color: var(--accent);
        }

        .sources {
            margin-top: 0.6rem;
            padding-top: 0.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .sources span {
            display: block;
        }

        #composer {
            display: flex;
            gap: 0.6rem;
            padding: 1rem 0.25rem 1.25rem;
            border-top: 1px solid var(--border);
        }

        #msg-input {
            flex: 1;
            background: var(--panel-raised);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: var(--radius);
            padding: 0.75rem 1rem;
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
        }

        #msg-input:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        #send-btn {
            background: var(--accent);
            color: #14162E;
            border: none;
            border-radius: var(--radius);
            padding: 0 1.3rem;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }

        #send-btn:hover {
            background: #ADA2FF;
        }

        #send-btn:focus-visible {
            outline: 2px solid var(--glow);
            outline-offset: 2px;
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-state {
            margin: auto;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.9rem;
            max-width: 420px;
            padding: 2rem;
        }

        .empty-state .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .suggestion-chip {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 999px;
            padding: 0.4rem 0.85rem;
            font-size: 0.82rem;
            cursor: pointer;
            font-family: inherit;
        }

        .suggestion-chip:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .typing-dots span {
            display: inline-block;
            width: 5px;
            height: 5px;
            margin-right: 3px;
            border-radius: 50%;
            background: var(--text-dim);
            animation: blink 1.2s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {

            0%,
            80%,
            100% {
                opacity: 0.25;
            }

            40% {
                opacity: 1;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Swastham-lite</h1>
        <p>A grounded assistant for sleep hygiene — general wellness info only, not a diagnosis.</p>
    </header>

    <main>
        <div id="status-bar">
            <span id="status-dot"></span>
            <span id="status-text">Connecting…</span>
        </div>

        <div id="chat" aria-live="polite">
            <div class="empty-state" id="empty-state">
                Ask about sleep hygiene, or try a scheduling tool.
                <div class="suggestions">
                    <button class="suggestion-chip" data-msg="How does caffeine affect my sleep?">How does caffeine
                        affect sleep?</button>
                    <button class="suggestion-chip" data-msg="What time should I go to bed if I wake at 6:30am?">Bedtime
                        for a 6:30am wake-up</button>
                    <button class="suggestion-chip"
                        data-msg="Can you build me a wind-down routine? My bedtime is 11pm">Build a wind-down
                        routine</button>
                </div>
            </div>
        </div>

        <form id="composer">
            <label for="msg-input" class="sr-only" style="position:absolute; left:-9999px;">Message</label>
            <input id="msg-input" type="text" placeholder="Ask a sleep question…" autocomplete="off" />
            <button id="send-btn" type="submit">Send</button>
        </form>
    </main>

    <script>
        // Change this if your API runs somewhere other than localhost:8000
        const API_BASE = "http://localhost:8000";

        const chatEl = document.getElementById("chat");
        const emptyStateEl = document.getElementById("empty-state");
        const formEl = document.getElementById("composer");
        const inputEl = document.getElementById("msg-input");
        const sendBtn = document.getElementById("send-btn");
        const statusDot = document.getElementById("status-dot");
        const statusText = document.getElementById("status-text");

        let sessionId = null;

        async function init() {
            try {
                const res = await fetch(`${API_BASE}/health`);
                if (!res.ok) throw new Error("health check failed");
                statusDot.classList.add("connected");
                statusText.textContent = "Connected";

                const sessionRes = await fetch(`${API_BASE}/session`, { method: "POST" });
                const data = await sessionRes.json();
                sessionId = data.session_id;
            } catch (err) {
                statusDot.classList.add("error");
                statusText.textContent = `Can't reach the API at ${API_BASE} — is uvicorn running?`;
                sendBtn.disabled = true;
            }
        }

        function scrollToBottom() {
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        function renderUserMessage(text) {
            emptyStateEl.remove();
            const div = document.createElement("div");
            div.className = "msg user";
            div.textContent = text;
            chatEl.appendChild(div);
            scrollToBottom();
        }

        function renderTypingIndicator() {
            const div = document.createElement("div");
            div.className = "msg assistant";
            div.id = "typing-indicator";
            div.innerHTML = `<span class="typing-dots"><span></span><span></span><span></span></span>`;
            chatEl.appendChild(div);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const el = document.getElementById("typing-indicator");
            if (el) el.remove();
        }

        const MODE_LABELS = {
            tool: "Tool",
            rag: "Grounded answer",
            clarify: "Needs more info",
            crisis: "Support resources",
        };

        function renderAssistantMessage(resp) {
            const div = document.createElement("div");
            div.className = `msg assistant mode-${resp.mode}`;

            const badge = document.createElement("span");
            badge.className = `badge ${resp.mode}`;
            badge.textContent = MODE_LABELS[resp.mode] || resp.mode;
            div.appendChild(badge);

            const textNode = document.createElement("div");
            textNode.textContent = resp.answer;
            div.appendChild(textNode);

            if (resp.sources && resp.sources.length > 0) {
                const src = document.createElement("div");
                src.className = "sources";
                src.innerHTML = "Sources: " + resp.sources.map(s => `${s.title} (${s.doc_id})`).join(", ");
                div.appendChild(src);
            }

            chatEl.appendChild(div);
            scrollToBottom();
        }

        function renderErrorMessage(text) {
            const div = document.createElement("div");
            div.className = "msg assistant mode-crisis";
            div.textContent = text;
            chatEl.appendChild(div);
            scrollToBottom();
        }

        async function sendMessage(text) {
            if (!text.trim() || !sessionId) return;

            renderUserMessage(text);
            inputEl.value = "";
            sendBtn.disabled = true;
            renderTypingIndicator();

            try {
                const res = await fetch(`${API_BASE}/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: sessionId, message: text }),
                });

                removeTypingIndicator();

                if (!res.ok) {
                    const errBody = await res.json().catch(() => ({}));
                    renderErrorMessage(`Something went wrong: ${errBody.detail || res.statusText}`);
                    return;
                }

                const data = await res.json();
                renderAssistantMessage(data);
            } catch (err) {
                removeTypingIndicator();
                renderErrorMessage("Couldn't reach the server. Check that uvicorn is still running.");
            } finally {
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        formEl.addEventListener("submit", (e) => {
            e.preventDefault();
            sendMessage(inputEl.value);
        });

        document.querySelectorAll(".suggestion-chip").forEach((btn) => {
            btn.addEventListener("click", () => sendMessage(btn.dataset.msg));
        });

        init();
    </script>

</body>

</html>
